<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Pasquale &amp; Laura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Hochzeit von Pasquale &amp; Laura: Programm, Anmeldung und alle Infos">
<meta property="og:type" content="website">
<meta property="og:title" content="Pasquale &amp; Laura">
<meta property="og:description" content="Wir heiraten · Ci sposiamo">
<meta property="og:url" content="https://pasqualelaura2028.github.io/">
<meta property="og:image" content="https://pasqualelaura2028.github.io/bilder/vorschau.jpg">
<meta name="theme-color" content="#F1F4EC">
<meta name="color-scheme" content="light only">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='25' cy='36' r='14' fill='none' stroke='%23A3824A' stroke-width='4'/%3E%3Ccircle cx='39' cy='36' r='14' fill='none' stroke='%23A3824A' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap">
<style>
/* Layout: eine Einladungs-Suite. Jede Sektion ist gesetzt wie eine Karte aus dem Briefpapier-Set: ruhige Mitte, feine Goldrahmen, Menükarte, Antwortkarte. */
:root{
  /* Farben: zartes Salbeigrün, Dunkelgrün für Schrift und Knöpfe, Gold als Akzent */
  --paper:#F1F4EC; --paper-2:#E4EBDF; --card:#FBFCF7; --ink:#1D2B22; --ink-2:#55665A; --rule:#CFDAC9;
  --gold:#B39248; --gold-ink:#86691F; --gold-wash:#ECE5CC; --btn:#1F3D2C; --btn-fg:#F6F2E2;
  --ok:#3F6B45; --warn:#9A6B1E; --err:#A14A3B; --scrim:rgba(18,34,25,.45); --shadow:rgba(18,34,25,.14);
  --env:#DCE4D4; --env-side:#D2DCC9; --env-flap:#D6DFCE; --env-liner:#1F3D2C; --seal-ink:#5E4713;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"EB Garamond",Garamond,"Times New Roman",serif;
  --f-ui:"Jost","Futura","Avenir Next","Segoe UI",system-ui,sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
/* Immer hell (wie im Couvert-Video), auch wenn Handy oder Computer im Dunkelmodus sind */

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1.125rem;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
a{color:var(--gold-ink)}
button{font:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ic{width:1.15em;height:1.15em;flex:none}
.wrap{max-width:1040px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}

/* Bausteine */
.eyebrow{font-family:var(--f-ui);font-size:.72rem;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-ink)}
.ornament{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold)}
.ornament::before,.ornament::after{content:"";height:1px;width:56px;background:currentColor;animation:draw 1.6s cubic-bezier(.2,.7,.2,1) both}
.ornament::before{transform-origin:right}.ornament::after{transform-origin:left}
.ornament i{width:7px;height:7px;border:1px solid currentColor;transform:rotate(45deg)}
@keyframes draw{from{transform:scaleX(.2)}to{transform:scaleX(1)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;font-family:var(--f-ui);font-size:.76rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;padding:1em 1.9em;border:1px solid var(--btn);background:var(--btn);color:var(--btn-fg);border-radius:1px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:transparent;color:var(--btn)}
.btn[disabled]{opacity:.55;cursor:default;pointer-events:none}
.btn-ghost{background:transparent;color:var(--gold-ink);border-color:var(--rule)}
.btn-ghost:hover{border-color:var(--gold);color:var(--ink)}
.btn-sm{font-size:.68rem;padding:.75em 1.15em;letter-spacing:.14em}
.linkish{background:none;border:0;padding:0;color:var(--gold-ink);font-family:var(--f-ui);font-size:.8rem;letter-spacing:.08em;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.lang{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{font-family:var(--f-ui);font-size:.7rem;font-weight:500;letter-spacing:.14em;padding:.55em .95em;border:0;background:transparent;color:var(--ink-2);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lang-float{position:absolute;top:16px;right:var(--gr);z-index:5}

/* Einladung / Hero */
.hero{position:relative;overflow:hidden;padding-block:clamp(64px,9vw,104px) clamp(48px,8vw,88px)}
.invite{position:relative;max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--gold);outline:1px solid var(--rule);outline-offset:-12px;padding:clamp(52px,9vw,92px) clamp(24px,7vw,80px);text-align:center;display:grid;gap:18px;justify-items:center}
.monogram{position:relative;width:150px;height:150px;display:grid;place-items:center;color:var(--gold);margin-block:-10px -4px}
.monogram .wreath{position:absolute;inset:0;width:100%;height:100%}
.monogram .mono{position:relative;font-family:var(--f-display);font-style:italic;font-size:1.75rem;color:var(--ink)}
.monogram .mono i{color:var(--gold);font-size:.8em;margin:0 .06em}
.monogram img{position:relative;width:60%;height:60%;border-radius:50%;object-fit:cover;border:1px solid var(--gold)}
.monogram.sm{width:104px;height:104px;margin:0}
.monogram.sm .mono{font-size:1.2rem}
.monogram.photo{width:190px;height:190px}
/* Gezeichnete Deko: Olivenzweige in Gold, Linien bleiben bei jeder Grösse fein */
.deco path,.deco circle{vector-effect:non-scaling-stroke}
.deco .stem{fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round}
.deco .lf{fill:currentColor;fill-opacity:.13;stroke:currentColor;stroke-width:.9;stroke-linejoin:round}
.deco .rib{fill:none;stroke:currentColor;stroke-width:.6;opacity:.75}
.deco .berry{fill:currentColor;fill-opacity:.55;stroke:currentColor;stroke-width:.8}
.side-deco{position:absolute;width:86px;height:330px;color:var(--gold);opacity:.6;pointer-events:none;display:none}
.side-deco svg{width:100%;height:100%;display:block}
.invite>.side-deco{top:50%;transform:translateY(-50%)}
.invite>.side-deco.l{left:-132px}
.invite>.side-deco.r{right:-132px;transform:translateY(-50%) scaleX(-1)}
@media (min-width:1080px){.invite>.side-deco{display:block}}
.sec>.side-deco{top:96px;width:64px;height:250px;opacity:.38}
.sec>.side-deco.l{left:max(18px,calc(50% - 640px))}
.sec>.side-deco.r{right:max(18px,calc(50% - 640px));transform:scaleX(-1)}
@media (min-width:1220px){.sec>.side-deco{display:block}}
.sprig-pair{width:132px;height:34px;color:var(--gold);justify-self:center;margin-bottom:-8px}
.names{display:flex;flex-direction:column;align-items:center;gap:0;font-size:clamp(3rem,13vw,4.6rem);line-height:1.02;letter-spacing:-.015em}
.names em{font-style:italic;color:var(--gold);font-size:.6em;line-height:1.2}
@media (min-width:700px){.names{flex-direction:row;gap:.26em;font-size:clamp(3.2rem,6.2vw,4.4rem)}}
.hero-date{font-family:var(--f-display);font-size:clamp(1.15rem,3.4vw,1.4rem);letter-spacing:.01em}
.hero-place{font-family:var(--f-ui);font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2);margin-top:-8px}
.countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;max-width:440px;border-block:1px solid var(--rule);margin-top:6px}
.cd{padding:14px 2px;display:grid;gap:4px;min-width:0}
.cd+.cd{border-left:1px solid var(--rule)}
.cd b{font-family:var(--f-display);font-weight:400;font-size:clamp(1.55rem,6vw,2.2rem);line-height:1;font-variant-numeric:tabular-nums lining-nums}
.cd span{font-family:var(--f-ui);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.cd-msg{grid-column:1/-1;font-family:var(--f-display);font-style:italic;font-size:1.4rem;padding:16px}
.welcome{max-width:44ch;color:var(--ink-2);font-size:1.17rem}
.hero-cta{display:grid;gap:12px;justify-items:center;margin-top:6px}
.rsvp-by{font-family:var(--f-ui);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.news-pill{display:inline-flex;align-items:center;gap:.6em;font-family:var(--f-ui);font-size:.8rem;color:var(--ink);background:var(--gold-wash);border-radius:999px;padding:.55em 1.1em;text-decoration:none;max-width:100%}
.news-pill b{font-weight:500;color:var(--gold-ink);letter-spacing:.12em;text-transform:uppercase;font-size:.68rem}
.news-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Navigation */
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-block:1px solid var(--rule)}
.nav-inner{display:flex;align-items:center;gap:18px;min-height:56px}
.nav-mono{font-family:var(--f-display);font-style:italic;font-size:1.3rem;color:var(--ink);text-decoration:none;flex:none}
.nav-mono i{color:var(--gold)}
.nav-links{display:flex;gap:24px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 28px),transparent);padding-inline:10px 28px}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{font-family:var(--f-ui);font-size:.7rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);text-decoration:none;white-space:nowrap;padding:10px 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.nav-links a:hover,.nav-links a.active{color:var(--ink);border-bottom-color:var(--gold)}
.topnav .lang{flex:none}

/* Sektionen */
/* Fotos als heller Schleier im Hintergrund: oben und unten weich auslaufend */
.ph-bg{isolation:isolate}
.ph-bg::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--ph) var(--ph-pos,50% 50%)/cover no-repeat;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%)}
.hero.ph-bg,.gate.ph-bg{--ph:url(bilder/hg-start.jpg);--ph-pos:50% 58%}
.hero.ph-bg::after,.gate.ph-bg::after{-webkit-mask-image:linear-gradient(180deg,#000 0,#000 88%,transparent 100%);mask-image:linear-gradient(180deg,#000 0,#000 88%,transparent 100%)}
#programm{--ph:url(bilder/hg-programm.jpg);--ph-pos:30% 50%}
#anmeldung{--ph:url(bilder/hg-anmeldung.jpg);--ph-pos:55% 35%}
.ph-bg .invite{background:rgba(251,252,247,.84);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sec{--sec-bg:var(--paper);position:relative;background:var(--sec-bg);padding-block:clamp(64px,10vw,112px);scroll-margin-top:calc(58px + env(safe-area-inset-top,0px))}
.sec.tint{--sec-bg:var(--paper-2)}
.sec-head{text-align:center;display:grid;gap:14px;justify-items:center;margin-bottom:clamp(36px,6vw,56px)}
.sec-head h2{font-size:clamp(2.1rem,5.6vw,3.1rem);line-height:1.08;letter-spacing:-.01em}
.lead{max-width:58ch;margin:0 auto;text-align:center;color:var(--ink-2)}
.meta{font-family:var(--f-ui);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.panel{background:var(--card);border:1px solid var(--rule);padding:26px;display:grid;gap:10px;align-content:start;min-width:0}
.panel h3{font-size:1.45rem;line-height:1.2}
.panel address{font-style:normal}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}

/* Neuigkeiten */
.news{max-width:760px;margin:0 auto;display:grid;border-top:1px solid var(--rule)}
.news-item{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:6px 24px;padding:22px 0;border-bottom:1px solid var(--rule)}
.news-item time{font-family:var(--f-ui);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);padding-top:.5em}
.news-item h3{font-size:1.45rem;line-height:1.25}
.news-item p{color:var(--ink-2);margin-top:6px}
@media (max-width:560px){.news-item{grid-template-columns:1fr}.news-item time{padding-top:0}}

/* Programm */
.timeline{list-style:none;margin:0 auto;padding:0;max-width:740px;display:grid}
.tl-item{display:grid;grid-template-columns:5.4rem minmax(0,1fr);gap:0 24px}
.tl-time{font-family:var(--f-display);font-size:1.5rem;line-height:1.25;color:var(--gold-ink);text-align:right;font-variant-numeric:lining-nums}
.tl-body{position:relative;padding:0 0 40px 28px;border-left:1px solid var(--rule);min-width:0}
.tl-item:last-child .tl-body{padding-bottom:0;border-left-color:transparent}
.tl-body::before{content:"";position:absolute;left:-5px;top:.62em;width:9px;height:9px;transform:rotate(45deg);background:var(--sec-bg);border:1px solid var(--gold)}
.tl-body h3{font-size:1.6rem;line-height:1.2}
.tl-body.has-ic::before{display:none}
.tl-ic{position:absolute;left:-17px;top:-2px;width:34px;height:34px;border-radius:50%;background:var(--sec-bg);border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold-ink)}
.tl-ic .ic{width:18px;height:18px}
.tl-body.has-ic{padding-left:34px}
.tl-place{margin-top:6px}
.tl-desc{margin-top:8px;color:var(--ink-2)}
@media (max-width:480px){.tl-item{grid-template-columns:3.7rem minmax(0,1fr);gap:0 14px}.tl-time{font-size:1.15rem;padding-top:.15em}.tl-body{padding-left:18px}.tl-body.has-ic{padding-left:28px}.tl-body h3{font-size:1.4rem}}
.travel-note{max-width:62ch;margin:32px auto 0;text-align:center;color:var(--ink-2)}

/* Menükarte */
.menu-card{max-width:540px;margin:0 auto;background:var(--card);border:1px solid var(--gold);outline:1px solid var(--rule);outline-offset:-10px;padding:clamp(40px,7vw,64px) clamp(22px,6vw,52px);text-align:center;display:grid;gap:24px}
.menu-card .menu-title{font-family:var(--f-display);font-style:italic;font-size:2rem}
.course{display:grid;gap:6px}
.course h3{font-family:var(--f-ui);font-size:.72rem;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-ink)}
.course p{font-style:italic;font-size:1.28rem;line-height:1.4}
.course+.course::before{content:"";width:5px;height:5px;transform:rotate(45deg);background:var(--gold);justify-self:center;margin-bottom:18px}
.menu-foot{font-family:var(--f-ui);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:20px}
.food-note{text-align:center;color:var(--ink-2);margin-top:22px;font-style:italic}

/* Antwortkarte */
.rsvp-card{max-width:680px;margin:0 auto;background:var(--card);border:1px solid var(--rule);padding:clamp(24px,5vw,44px);display:grid;gap:24px}
.choice-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.choice{font-family:var(--f-display);font-size:1.25rem;padding:20px 16px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer;display:grid;gap:8px;justify-items:center;transition:border-color .2s,background .2s}
.choice .tick{width:22px;height:22px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;color:var(--btn-fg)}
.choice[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-wash)}
.choice[aria-pressed="true"] .tick{background:var(--btn);border-color:var(--btn)}
.choice:hover{border-color:var(--gold)}
.fields{display:grid;gap:18px}
.row2{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.field{display:grid;gap:6px;min-width:0}
.field label,.label{font-family:var(--f-ui);font-size:.7rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.field input,.field select,.field textarea{font-family:var(--f-body);font-size:1.08rem;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:.65em .8em;width:100%;min-width:0}
.field textarea{min-height:5.2em;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-wash)}
.field.invalid input,.field.invalid select{border-color:var(--err)}
.hint{font-size:.95rem;color:var(--ink-2)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--rule);background:var(--paper);justify-self:start}
.stepper button{width:46px;height:46px;font-size:1.35rem;border:0;background:transparent;color:var(--ink);cursor:pointer}
.stepper button[disabled]{opacity:.3;cursor:default}
.stepper output{min-width:46px;text-align:center;font-family:var(--f-display);font-size:1.4rem;font-variant-numeric:lining-nums}
.person{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px 14px;align-items:end;padding-top:16px;border-top:1px dashed var(--rule)}
.person.solo{grid-template-columns:1fr}
@media (max-width:520px){.person{grid-template-columns:1fr}}
.person-tag{grid-column:1/-1;font-family:var(--f-ui);font-size:.66rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-ink)}
.checks{display:flex;flex-wrap:wrap;gap:10px 24px}
.check{display:inline-flex;align-items:center;gap:9px;font-size:1.05rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--btn)}
.form-error{color:var(--err);font-family:var(--f-ui);font-size:.86rem;min-height:1.3em}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.submit-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.notice{font-family:var(--f-ui);font-size:.82rem;background:var(--gold-wash);color:var(--ink);padding:.75em 1em}
.done{text-align:center;display:grid;gap:14px;justify-items:center;padding-block:12px}
.seal{width:66px;height:66px;border-radius:50%;background:var(--gold-wash);border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold-ink)}
.seal .ic{width:28px;height:28px}
.thanks-sub{font-family:var(--f-display);font-style:italic;font-size:1.15rem;color:var(--ink-2);margin-top:-6px}
.done h3{font-size:clamp(1.6rem,4.2vw,2.1rem)}
.done p{color:var(--ink-2);max-width:46ch}
.done .actions{justify-content:center}

/* Geschenke */
.contrib{max-width:640px;margin:0 auto 40px;border:1px solid var(--gold);background:var(--card);padding:clamp(22px,4vw,32px);display:grid;gap:12px;justify-items:center;text-align:center}
.contrib p{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.gift{background:var(--card);border:1px solid var(--rule);display:grid;grid-template-rows:auto 1fr;min-width:0}
.gift-img{aspect-ratio:16/10;max-width:100%;background:var(--paper-2);display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--rule);color:var(--gold)}
.gift-img img{width:100%;height:100%;object-fit:cover}
.gift-img .ic{width:40px;height:40px}
.gift-img.empty{aspect-ratio:auto;height:88px}
.gift-body{padding:20px 22px 22px;display:grid;gap:8px;align-content:start}
.gift-body h3{font-size:1.32rem;line-height:1.25}
.gift-body p{color:var(--ink-2);font-size:1.02rem}

/* Datum aus dem Sheet: 2028-08-23 oder 23.08.2028 (auch 23.8.2028 / 23/08/2028) → 2028-08-23 */
function normIso(v){
  const x = String(v == null ? '' : v).trim();
  const m = /^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/.exec(x);
  return m ? m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') + x.slice(m[0].length) : x;
}
function fmtDate(iso, opts){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(normIso(iso));
  if (!m) return String(iso || '');
  const d = new Date(Date.UTC(+m[1], +m[2]-1, +m[3]));
  try { return new Intl.DateTimeFormat(S.lang === 'it' ? 'it-CH' : 'de-CH', Object.assign({ timeZone:'UTC', day:'numeric', month:'long', year:'numeric' }, opts || {})).format(d); }
  catch(e){ return m[3] + '.' + m[2] + '.' + m[1]; }
}
function zurichTime(iso, hhmm){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(normIso(iso));
  if (!m) return null;
  const tm = /^(\d{1,2}):(\d{2})/.exec(String(hhmm || '')) || [0, '12', '00'];
  const guess = Date.UTC(+m[1], +m[2]-1, +m[3], +tm[1], +tm[2]);
  let offset = 1;
  try {
    const part = new Intl.DateTimeFormat('en-US', { timeZone:'Europe/Zurich', timeZoneName:'shortOffset' }).formatToParts(new Date(guess)).find(p => p.type === 'timeZoneName');
    const om = /GMT([+-]\d+)/.exec(part ? part.value : ''); if (om) offset = +om[1];
  } catch(e){}
  return new Date(guess - offset * 3600e3);
}
function daysUntil(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(normIso(iso)); if (!m) return null;
  const now = new Date(); const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((Date.UTC(+m[1], +m[2]-1, +m[3]) - today) / 864e5);
}

}

function computeAdmin(guests, optsDe, extra){

    stats: { responses: guests.length, yes: yes.length, no: guests.length - yes.length,

async function demoApi(action, p){
  await sleep(action === 'uploadPhoto' ? 650 : 380);
  const st = demoLoad();
  const accessOk = String(p.code || '').trim().toUpperCase() === DEMO_CODE || (p.token && st.rsvps.some(r => r.id === p.token));
  const isAdmin = String(p.adminCode || '').trim().toUpperCase() === DEMO_ADMIN;
  const preview = !!p.preview && isAdmin;
  const std = st.phase === 'std';
  const buildContent = () => {
    const c = JSON.parse(JSON.stringify(DEMO_CONTENT));
    c.gifts.forEach(g => { g.reserved = !!st.reserved[g.id]; });
    c.news = st.news.slice().reverse().sort((a, b) => String(b.date).localeCompare(String(a.date))); // neueste zuerst
    c.settings.mode = std ? 'std' : 'invite';
    const rel = demoRel(st); c.settings.show = rel.show; c.settings.showFrom = rel.from;
    return c;
  };
  const rel = demoRel(st);
  switch (action) {
    case 'content': {
      if (!accessOk && !preview) return { ok:false, error:'code' };
      const mine = p.token ? st.rsvps.find(r => r.id === p.token) : null;
      let c = buildContent();
      if (std && !preview) { c = stripStd(c); c.settings.show = {}; Object.keys(DEMO_SHOW).forEach(k => { c.settings.show[k] = false; }); }
      else if (!preview) c = stripHidden(c);
      c.preview = preview;
      return { ok:true, content: c, myRsvp: (std && !preview) ? null : (mine || null), preview };
    }
    case 'rsvp': {
      if (!accessOk && !preview) return { ok:false, error:'code' };
      if (std && !preview) return { ok:false, error:'std' };
      if (!rel.show.rsvp && !preview) return { ok:false, error:'closed' };
      const d = p.data || {};
      let r = (d.id && st.rsvps.find(x => x.id === d.id)) || st.rsvps.find(x => x.email.toLowerCase() === String(d.email).toLowerCase());
      const now = new Date().toISOString().slice(0, 10);
      if (!r) { r = { id: 'd' + Date.now(), created: now }; st.rsvps.push(r); }
      const kids = d.attending ? Math.max(0, Math.min(DEMO_CONTENT.settings.maxKids, Number(d.kids) || 0)) : 0;
      Object.assign(r, { name:d.name, email:d.email, phone:d.phone, address: d.address || r.address || '', lang:d.lang, attending:!!d.attending, persons: d.attending ? d.persons.slice(0, DEMO_CONTENT.settings.maxAdults) : [], kids, allergies:d.allergies, message:d.message, wa:!!d.wa, changed: now });
      demoSave();
      return { ok:true, id:r.id };
    }
    case 'reserveGift': {
      if (!accessOk && !preview) return { ok:false, error:'code' };
      if ((std || !rel.show.gifts) && !preview) return { ok:false, error:'closed' };
      if (st.reserved[p.id]) return { ok:false, error:'taken' };
      st.reserved[p.id] = p.name; demoSave();
      return { ok:true };
    }
    case 'uploadPhoto': {
      if (!accessOk && !preview) return { ok:false, error:'code' };
      if (!rel.show.photos && !preview) return { ok:false, error:'closed' };
      st.photos++; demoSave(); return { ok:true };
    }
    case 'saveContact': {
      if (!accessOk) return { ok:false, error:'code' };
      const d = p.data || {};
      let c = st.contacts.find(x => x.email.toLowerCase() === String(d.email).toLowerCase());
      if (!c) { c = { id: 'c' + Date.now(), invited:'' }; st.contacts.push(c); }
      Object.assign(c, { name:d.name, email:d.email, phone:d.phone, address: d.address || c.address || '', lang:d.lang });
      demoSave(); return { ok:true };
    }
    case 'adminSendInvites': {
      if (!isAdmin) return { ok:false, error:'code' };
      if (std) return { ok:false, error:'std' };
      let sent = 0; const today = new Date().toISOString().slice(0, 10);
      st.contacts.forEach(c => { if (!c.invited && !st.rsvps.some(r => r.email.toLowerCase() === c.email.toLowerCase())) { c.invited = today; sent++; } });
      demoSave(); return { ok:true, sent, queued:0 };
    }
    case 'adminLogin': {
      if (String(p.adminCode || '').trim().toUpperCase() !== DEMO_ADMIN) return { ok:false, error:'code' };
      return computeAdmin(st.rsvps, DEMO_CONTENT.settings.menuOptions.de, {
        status: { mail:'gmail', quota: 87, queue: 0, teamWa: 3, teamMail: 4, sheetUrl:'', photosUrl:'', photos: st.photos, siteUrl:'', guestCode: DEMO_CODE, date: DEMO_CONTENT.settings.date, couple: DEMO_CONTENT.settings.couple, deadline: DEMO_CONTENT.settings.deadline, mode: std ? 'std' : 'invite',
          show: rel.show, showFrom: rel.from, showRaw: rel.raw, photosOn: true },
        contacts: st.contacts.map(c => Object.assign({}, c, { registered: st.rsvps.some(r => r.email.toLowerCase() === c.email.toLowerCase()) })),
        news: st.news
      });
    }
    case 'adminSetShow': {
      if (!isAdmin) return { ok:false, error:'code' };
      const v = String(p.value || '');
      if (!(p.key in DEMO_SHOW) || !/^(Ja|Nein|Hochzeitstag|\d{4}-\d{2}-\d{2})$/.test(v)) return { ok:false, error:'invalid' };
      st.show[p.key] = v; demoSave();
      return demoApi('adminLogin', { adminCode: p.adminCode });
    }
    case 'adminSetMode': {
      if (!isAdmin) return { ok:false, error:'code' };
      st.phase = p.mode === 'std' ? 'std' : 'invite';
      let sent = 0; const today = new Date().toISOString().slice(0, 10);
      if (st.phase === 'invite') st.contacts.forEach(c => { if (!c.invited && !st.rsvps.some(r => r.email.toLowerCase() === c.email.toLowerCase())) { c.invited = today; sent++; } });
      demoSave();
      const d = await demoApi('adminLogin', { adminCode: p.adminCode }); d.invites = { sent, queued:0 }; return d;
    }
    case 'adminSendUpdate': {
      if (String(p.adminCode || '').trim().toUpperCase() !== DEMO_ADMIN) return { ok:false, error:'code' };
      const list = st.rsvps.filter(g => p.audience === 'all' || g.attending);
      if (p.news) { st.news.push({ date: new Date().toISOString().slice(0, 10), title: p.title, text: p.text }); demoSave(); }
      return { ok:true, sent: p.email ? list.length : 0, queued:0, failed:0, count:list.length };
    }
    case 'adminTest': {
      if (String(p.adminCode || '').trim().toUpperCase() !== DEMO_ADMIN) return { ok:false, error:'code' };
      return { ok:true, results:[ { name:'Trauzeuge', whatsapp:'ok', email:'ok' }, { name:'Pasquale', whatsapp:'ok', email:'ok' }, { name:'Laura', whatsapp:'ok', email:'ok' }, { name:'Trauzeugin', whatsapp:'fehlt', email:'ok' } ] };
    }
  }
  return { ok:false, error:'unknown_action' };
}

const f2 = n => n.toFixed(2);
function leaf(x, y, ang, L){
  const W = L * 0.27;
  return '<g transform="translate(' + f2(x) + ' ' + f2(y) + ') rotate(' + ang.toFixed(1) + ')"><path class="lf" d="M0 0C' + f2(L*.3) + ' ' + f2(-W) + ' ' + f2(L*.72) + ' ' + f2(-W*.8) + ' ' + f2(L) + ' 0C' + f2(L*.72) + ' ' + f2(W*.8) + ' ' + f2(L*.3) + ' ' + f2(W) + ' 0 0Z"/><path class="rib" d="M' + f2(L*.12) + ' 0L' + f2(L*.8) + ' 0"/></g>';
}
function branch(P0, C, P1, N, L0, L1, berries){
  const q = t => [(1-t)*(1-t)*P0[0] + 2*(1-t)*t*C[0] + t*t*P1[0], (1-t)*(1-t)*P0[1] + 2*(1-t)*t*C[1] + t*t*P1[1]];
  const dq = t => [2*(1-t)*(C[0]-P0[0]) + 2*t*(P1[0]-C[0]), 2*(1-t)*(C[1]-P0[1]) + 2*t*(P1[1]-C[1])];
  let g = '<path class="stem" d="M' + P0.join(' ') + 'Q' + C.join(' ') + ' ' + P1.join(' ') + '"/>';
  for (let k = 0; k < N; k++) {
    const t = 0.07 + 0.86 * k / (N - 1), p = q(t), d = dq(t), L = L0 + (L1 - L0) * k / (N - 1), side = k % 2 ? 1 : -1;
    const ang = Math.atan2(d[1], d[0]) * 180 / Math.PI;
    g += leaf(p[0], p[1], ang + side * 42, L);
    if (berries && k % 4 === 2) {
      const n = Math.hypot(d[0], d[1]) || 1, ox = -d[1] / n * L * .42 * -side, oy = d[0] / n * L * .42 * -side;
      g += '<circle class="berry" cx="' + f2(p[0] + ox) + '" cy="' + f2(p[1] + oy) + '" r="' + f2(L * .11) + '"/>';
    }
  }
  const de = dq(1);
  return g + leaf(P1[0], P1[1], Math.atan2(de[1], de[0]) * 180 / Math.PI, L1 * 1.05);
}
function wreathSvg(){
  const cx = 50, cy = 50, r = 37, a0 = 104, a1 = 258, N = 10, rad = a => a * Math.PI / 180;

    const a = a0 + 8 + (a1 - a0 - 10) * k / (N - 1), p = pt(a), tan = Math.atan2(Math.cos(rad(a)), -Math.sin(rad(a))) * 180 / Math.PI, L = 12.5 - k * .55;
    g += leaf(p[0], p[1], tan - 38, L) + leaf(p[0], p[1], tan + 34, L * .9);
    if (k % 3 === 1) { const b = pt(a + 4); g += '<circle class="berry" cx="' + f2(b[0] + (cx - b[0]) * .1) + '" cy="' + f2(b[1] + (cy - b[1]) * .1) + '" r="1.25"/>'; }

function stampSvg(a, b){

  d += ' L' + W + ' 0';
  e = notch(H); for (let k = 0; k < e.n; k++) { const c = e.s * (k + .5); d += ' L' + W + ' ' + (c - r).toFixed(2) + ' A' + r + ' ' + r + ' 0 0 0 ' + W + ' ' + (c + r).toFixed(2); }
  d += ' L' + W + ' ' + H;
  e = notch(W); for (let k = 0; k < e.n; k++) { const c = W - e.s * (k + .5); d += ' L' + (c + r).toFixed(2) + ' ' + H + ' A' + r + ' ' + r + ' 0 0 0 ' + (c - r).toFixed(2) + ' ' + H; }
  d += ' L0 ' + H;
  e = notch(H); for (let k = 0; k < e.n; k++) { const c = H - e.s * (k + .5); d += ' L0 ' + (c + r).toFixed(2) + ' A' + r + ' ' + r + ' 0 0 0 0 ' + (c - r).toFixed(2); }
  d += ' Z';
  return '<svg class="envf-stamp" viewBox="0 0 100 122" aria-hidden="true"><path class="st-paper" d="' + d + '"/>' +
    '<rect class="st-field" x="9" y="9" width="82" height="104"/><rect class="st-frame" x="13.5" y="13.5" width="73" height="95"/>' +
    '<text class="st-mono" x="50" y="74" text-anchor="middle">' + esc(a.charAt(0)) + '<tspan dx="1" dy="-2">&amp;</tspan><tspan dx="1" dy="2" style="font-size:30px">' + esc(b.charAt(0)) + '</tspan></text>' +
    '<image class="st-photo" href="bilder/marke.jpg" x="9" y="9" width="82" height="104" preserveAspectRatio="xMidYMid slice"/>' +
    '<defs><linearGradient id="stShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10251B" stop-opacity=".62"/><stop offset=".26" stop-color="#10251B" stop-opacity="0"/>' +
    '<stop offset=".74" stop-color="#10251B" stop-opacity="0"/><stop offset="1" stop-color="#10251B" stop-opacity=".55"/></linearGradient></defs>' +
    '<rect x="9" y="9" width="82" height="104" fill="url(#stShade)"/><rect class="st-frame" x="13.5" y="13.5" width="73" height="95"/>' +
    '<text class="st-top" x="50" y="25" text-anchor="middle">HELVETIA</text>' +

function mountEnvelope(){

    sess.set('pl_env', '1'); document.documentElement.classList.remove('env-open'); stage.remove();
    const target = $('.pick button') || $('#gateCode') || $('.hero h1');
    if (target) { if (target.tagName === 'H1') target.setAttribute('tabindex', '-1'); target.focus({ preventScroll: true }); }
  };
  // Die Karte verlässt das Couvert und wächst als eigenes Blatt bis über den ganzen Bildschirm
  const grow = () => {
    const card = $('.env-card', stage); if (!card) return;
    const r = card.getBoundingClientRect(), sheet = document.createElement('div');
    sheet.className = 'env-sheet'; sheet.setAttribute('aria-hidden', 'true'); sheet.innerHTML = card.innerHTML;
    Object.assign(sheet.style, { top: r.top + 'px', left: r.left + 'px', width: r.width + 'px', height: r.height + 'px' });
    const ms = innerHeight < 520 ? 1.25 : 2.1, mono = $('.monogram', sheet);
    if (S.paar && mono) {   // Paarfoto: wächst im Kranz mit, bis man die beiden gross sieht
      sheet.classList.add('has-photo'); sheet.style.setProperty('--ms', ms);

    }
    stage.appendChild(sheet); stage.classList.add('s3');
    // Wie gross alles am Ende wird: am Handy etwas, am Computer mehr, aber immer ganz sichtbar
    const inner = $('.env-card-in', sheet), finalH = inner.offsetHeight + (sheet.classList.contains('has-photo') ? 104 * ms - 58 : 0);
    let gs = Math.max(1.35, Math.min(innerWidth / r.width, innerHeight / r.height) * .85);
    gs = Math.min(gs, innerHeight * .9 / finalH, innerWidth * .92 / Math.max(inner.offsetWidth, 1));

    void sheet.offsetWidth; // Startgrösse festhalten, dann wachsen
    stage.classList.add('grow');
  };
  const at = (ms, fn) => envTimers.push(setTimeout(fn, ms));
  const open = () => {
    if (started) return; started = true;
    stage.classList.add('go');                        // Vorderseite dreht sich um
    at(1120, () => stage.classList.add('flat'));       // Rückseite liegt flach
    at(1350, () => stage.classList.add('s1'));         // Siegel bricht, Lasche geht auf
    at(2250, () => stage.classList.add('s2'));         // Karte gleitet heraus
    at(3150, grow);                                    // Karte wächst über den ganzen Bildschirm
    at(4850, () => stage.classList.add('s4'));         // Übergang in die Seite
    at(5750, finish);
  };
  stage.addEventListener('click', open);
  stage.addEventListener('keydown', e => {

function rsvpBandInner(){

  if (S.rsvpDone) {
    const yes = S.rsvpDone.attending, n = R.persons.length + (R.kids || 0);

  return '<div class="actions"><a class="btn" href="#anmeldung" data-rsvp-open>' + esc(t('rsvpNow')) + '</a></div>';
}
function openRsvp(){
  const d = $('#rsvpDialog'); if (!d) return;
  S.rsvpOpen = true;
  if (!d.open) { try { d.showModal(); } catch(e){ d.setAttribute('open', ''); } }
  document.documentElement.classList.add('modal-open');
  d.scrollTop = 0;
  const first = $('[data-attend="1"]', d) || $('.sheet-x', d); if (first) first.focus({ preventScroll: true });
}
function closeRsvp(){
  const d = $('#rsvpDialog');
  S.rsvpOpen = false; document.documentElement.classList.remove('modal-open');
  if (d && d.open) d.close();
  if (S.rsvpDone && S.rsvpDone.fresh) S.rsvpDone.fresh = false;
  render({ keepScroll: true }); // Startknopf und Hinweis unten zeigen jetzt den neuen Stand
}
function bindRsvpWindow(){
  $$('[data-rsvp-open]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); openRsvp(); }));
  const d = $('#rsvpDialog'); if (!d) return;
  d.addEventListener('cancel', e => { e.preventDefault(); closeRsvp(); });
  d.addEventListener('click', e => { if (e.target === d) closeRsvp(); });
  d.addEventListener('click', e => { if (e.target.closest('[data-rsvp-close]')) closeRsvp(); });
  if (S.rsvpOpen) openRsvp();
  else if (location.hash === '#anmeldung') { history.replaceState(null, '', location.pathname + location.search); openRsvp(); }
}

function refreshContact(){ const el = $('#contactCard'); if (el) { el.innerHTML = contactInner(); bindContact(); } }
function bindContact(){
  const card = $('#contactCard'); if (!card) return;
  const C = S.contact;
  $$('[data-cbind]', card).forEach(i => i.addEventListener('input', () => { C[i.dataset.cbind] = i.value; const f = i.closest('.field'); if (f) f.classList.remove('invalid'); }));
  const again = $('[data-contact-again]', card); if (again) again.addEventListener('click', () => { S.contact = { name:'', email:'', phone:'', address:'', wa:false, done:'', fresh:false }; store.del('pl_contact'); refreshContact(); const n = $('#cName'); if (n) n.focus(); });
  const form = $('#contactForm', card); if (!form) return;
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('#contactErr'), bad = [];
    if (!C.name.trim()) bad.push('cName');
    if (!isEmail(C.email)) bad.push('cEmail');
    if (C.address.trim().length < 8) bad.push('cAddress');
    if (bad.length) { bad.forEach(k => $('[data-field="' + k + '"]').classList.add('invalid')); err.textContent = t('fixFields'); $('#' + bad[0]).focus(); return; }
    const btn = $('#contactSubmit'); btn.disabled = true; btn.textContent = t('sending'); err.textContent = '';
    try {
      const res = await api('saveContact', { code: S.code, token: S.token, website: ($('#cWebsite') || {}).value || '',
        data: { name: C.name.trim(), email: C.email.trim(), phone: C.phone.trim(), address: C.address.trim(), lang: S.lang } });
      if (!res || !res.ok) throw new Error(res && res.error || 'error');
      C.done = C.name.trim(); C.fresh = true; store.set('pl_contact', C.done);
      refreshContact(); confetti();
    } catch(ex){ btn.disabled = false; btn.textContent = t('stdSend'); err.textContent = t('sendError'); }
  });
}

/* ---------- Ansicht: Webseite ---------- */
function uniquePlaces(program){
  const map = new Map();
  (program || []).forEach(p => {
    if (!p.address) return;
    const key = (p.place + '|' + p.address).toLowerCase();
    if (!map.has(key)) map.set(key, { place:p.place, address:p.address, map:p.map, items:[] });
    map.get(key).items.push(p.time + ' ' + tx(p.title));
  });
  return Array.from(map.values());
}
function routeUrl(pl){ return pl.map || ('https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent((pl.place ? pl.place + ', ' : '') + pl.address)); }

function countdownHtml(){
  const st = S.content.settings, target = zurichTime(st.date, st.time);
  if (!target) return '';
  const diff = target - Date.now();
  if (diff <= 0) {
    const d = daysUntil(st.date);
    return '<div class="countdown" id="countdown"><p class="cd-msg">' + esc(d === 0 ? t('today') : t('past')) + '</p></div>';
  }
  const s = Math.floor(diff / 1000), parts = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
  const labels = ['days','hours','minutes','seconds'];
  return '<div class="countdown" id="countdown" aria-label="Countdown">' + parts.map((v, i) => '<div class="cd"><b data-cd="' + i + '">' + (i ? String(v).padStart(2, '0') : v) + '</b><span>' + esc(t(labels[i])) + '</span></div>').join('') + '</div>';
}

  if (c.menu.length) blocks.push({ id:'menue', nav:'navFood', html: secHead(t('foodEyebrow'), t('foodTitle')) +
    '<div class="menu-card">' + sprigPair() + '<p class="menu-title">' + esc(t('menuCard')) + '</p>' + c.menu.map(m => '<div class="course"><h3>' + esc(tx(m.course)) + '</h3><p>' + nl2br(tx(m.desc)) + '</p></div>').join('') +

  return pageHtml(ph, shown);
}

  return '<div class="stepper" role="group" aria-labelledby="' + lbl + '"><button type="button" data-step-' + kind + '="-1" aria-label="−"' + (val <= min ? ' disabled' : '') + '>−</button>' +
    '<output aria-live="polite">' + val + '</output><button type="button" data-step-' + kind + '="1" aria-label="+"' + (val >= max ? ' disabled' : '') + '>+</button></div>';
}

function refreshRsvp(){ const el = $('#rsvpCard'); if (el) { el.innerHTML = rsvpInner(); bindRsvp(); } }
function bindRsvp(){
  const card = $('#rsvpCard'); if (!card) return;
  const R = S.rsvp;
  $$('[data-attend]', card).forEach(b => b.addEventListener('click', () => { R.attending = b.dataset.attend === '1'; refreshRsvp(); const f = $('#rName'); if (f && !R.name) f.focus(); }));
  $$('[data-bind]', card).forEach(inp => inp.addEventListener('input', () => {
    R[inp.dataset.bind] = inp.value; inp.closest('.field') && inp.closest('.field').classList.remove('invalid');
    if (inp.dataset.bind === 'name') { const p0 = $('#pn0'); if (p0) p0.placeholder = inp.value || t('personName'); }
  }));
  $$('[data-bind-check]', card).forEach(inp => inp.addEventListener('change', () => { R[inp.dataset.bindCheck] = inp.checked; }));
  $$('[data-person]', card).forEach(inp => inp.addEventListener(inp.tagName === 'SELECT' ? 'change' : 'input', () => {
    R.persons[+inp.dataset.person][inp.dataset.key] = inp.value; inp.closest('.field').classList.remove('invalid');
  }));
  $$('[data-step-a]', card).forEach(b => b.addEventListener('click', () => {
    const n = Math.min(maxAdults(), Math.max(1, R.persons.length + Number(b.dataset.stepA)));
    while (R.persons.length < n) R.persons.push({ name:'', menu:'' });
    R.persons.length = n; refreshRsvp();
    const x = $('[data-step-a="' + b.dataset.stepA + '"]', $('#rsvpCard')); if (x && !x.disabled) x.focus();
  }));
  $$('[data-step-k]', card).forEach(b => b.addEventListener('click', () => {
    R.kids = Math.min(maxKids(), Math.max(0, (R.kids || 0) + Number(b.dataset.stepK))); refreshRsvp();
    const x = $('[data-step-k="' + b.dataset.stepK + '"]', $('#rsvpCard')); if (x && !x.disabled) x.focus();
  }));
  const ed = $('[data-rsvp-edit]', card); if (ed) ed.addEventListener('click', () => { S.editing = true; refreshRsvp(); });
  const cn = $('[data-rsvp-cancel]', card); if (cn) cn.addEventListener('click', () => { S.editing = false; refreshRsvp(); });
  const nw = $('[data-rsvp-new]', card); if (nw) nw.addEventListener('click', () => { S.rsvp = freshRsvp(); S.rsvpDone = null; S.editing = false; store.del('pl_rsvp'); refreshRsvp(); });
  const form = $('#rsvpForm', card); if (form) form.addEventListener('submit', submitRsvp);
}
async function submitRsvp(e){
  e.preventDefault();
  const R = S.rsvp, st = S.content.settings, err = $('#rsvpErr');

/* ---------- Fotos ---------- */
async function prepareImage(file){
  try {
    if (!window.createImageBitmap) throw new Error('no bitmap');
    const bmp = await createImageBitmap(file, { imageOrientation:'from-image' });
    const max = 2200, s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', 0.86);
    return { mime:'image/jpeg', data: url.split(',')[1], name: file.name.replace(/\.[^.]+$/, '') + '.jpg' };
  } catch(e){
    if (file.size > 9e6) throw new Error('too_big');
    const data = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(file); });
    return { mime: file.type || 'image/jpeg', data, name: file.name };
  }
}
async function uploadFiles(files){
  files = Array.from(files || []).filter(f => /^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));
  if (!files.length || S.upload.busy) return;
  S.upload.busy = true;
  const bar = () => $('#upBar'), status = () => $('#upStatus');
  const name = ($('#upName') || {}).value || '';
  let ok = 0, bad = 0;
  for (let i = 0; i < files.length; i++) {
    S.upload.msg = t('uploading', { i: i + 1, n: files.length }); if (status()) status().textContent = S.upload.msg;
    try {
      const img = await prepareImage(files[i]);
      const res = await api('uploadPhoto', { code: S.code, token: S.token, name, filename: img.name, mime: img.mime, data: img.data, preview: S.preview, adminCode: S.preview ? S.admin.code : undefined });
      if (res && res.ok) ok++; else bad++;
    } catch(e){ bad++; }
    S.upload.pct = Math.round((i + 1) / files.length * 100); if (bar()) bar().style.width = S.upload.pct + '%';
  }
  S.upload.msg = (ok ? t('uploaded', { n: ok }) : '') + (bad ? ' ' + t('uploadFailed', { n: bad }) : '');
  if (status()) status().textContent = S.upload.msg;
  S.upload.busy = false;
  const inp = $('#upFiles'); if (inp) inp.value = '';
  setTimeout(() => { if (!S.upload.busy) { S.upload.pct = 0; if (bar()) bar().style.width = '0%'; } }, 2500);
}

/* ---------- Konfetti ---------- */
function confetti(){
  if (reduceMotion) return;
  const cs = getComputedStyle(document.documentElement);
  const colors = ['--gold', '--gold-ink', '--rule', '--ink-2'].map(v => cs.getPropertyValue(v).trim() || '#B39248');
  const cv = document.createElement('canvas'); cv.id = 'confetti'; (document.querySelector('dialog[open]') || document.body).appendChild(cv);
  const ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  const bits = Array.from({ length: 140 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .45, vx: (Math.random() - .5) * 14 * dpr, vy: (-Math.random() * 15 - 6) * dpr, s: (Math.random() * 6 + 4) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: colors[Math.floor(Math.random() * colors.length)] }));
  const start = performance.now();
  (function frame(now){
    const tt = now - start; ctx.clearRect(0, 0, W, H);
    bits.forEach(b => { b.vy += .45 * dpr; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.globalAlpha = Math.max(0, 1 - tt / 2600); ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore(); });
    if (tt < 2600) requestAnimationFrame(frame); else cv.remove();
  })(start);
}

function adminQr(){
  const A = S.admin, st = A.data.status || {};
  const base = st.siteUrl || (location.origin + location.pathname);
  const url = base + (A.qrCode && st.guestCode ? (base.includes('?') ? '&' : '?') + 'code=' + encodeURIComponent(st.guestCode) : '');
  return '<div class="cols"><section class="box qr-box"><h2>QR-Code für Einladung und Tische</h2><p>Gäste scannen den Code mit der Handykamera und landen direkt auf der Webseite.</p>' +
    '<label class="check"><input type="checkbox" id="qrCode"' + (A.qrCode ? ' checked' : '') + '> Gästecode im Link (Gäste müssen ihn nicht eintippen)</label>' +
    '<div class="qr-frame" id="qr" data-url="' + esc(url) + '"></div><p class="url">' + esc(url) + '</p>' +
    '<p class="hint">Bild speichern: lange auf den Code drücken (Handy) oder Rechtsklick und «Bild speichern unter» (Computer).</p>' +
    (!st.siteUrl && !DEMO ? '<p class="form-error">Tipp: Trag im Google Sheet unter «Webseite_URL» die richtige Adresse ein.</p>' : '') + '</section></div>';
}
function drawQr(){
  const el = $('#qr'); if (!el) return;
  const go = () => {
    el.innerHTML = '';
    try { new window.QRCode(el, { text: el.dataset.url, width: 480, height: 480, colorDark:'#2A2622', colorLight:'#ffffff', correctLevel: window.QRCode.CorrectLevel.M }); }
    catch(e){ el.textContent = 'QR-Code konnte nicht erstellt werden.'; }
  };
  if (window.QRCode) return go();
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  s.onload = go; s.onerror = () => { el.textContent = 'QR-Code-Bibliothek konnte nicht geladen werden.'; };
  document.head.appendChild(s);
}
async function adminLoad(code){
  const A = S.admin; A.busy = true; A.error = ''; if (!A.data) render();
  try {
    const res = await api('adminLogin', { adminCode: code });
    if (!res.ok) { A.data = null; A.error = res.error === 'code' ? 'Dieser Admin-Code stimmt nicht.' : 'Fehler: ' + (res.message || res.error); sess.del('pl_admin'); }
    else { A.data = res; A.code = code; sess.set('pl_admin', code); }
  } catch(e){ A.error = 'Keine Verbindung zum Server. Prüfe die API_URL und deine Internetverbindung.'; }
  A.busy = false; render();
}
function tableLabels(){ // Spaltennamen für die Karten-Ansicht auf dem Handy
  $$('.table-wrap table').forEach(tb => {
    const h = $$('thead th', tb).map(th => th.textContent);
    $$('tbody tr', tb).forEach(tr => $$('td', tr).forEach((td, i) => { if (!td.hasAttribute('colspan')) { td.dataset.label = h[i] || ''; if (/^[\s–-]*$/.test(td.textContent)) td.classList.add('empty'); } }));
  });
}

  const mc = $('[data-msg-cancel]'); if (mc) mc.addEventListener('click', () => { A.msg.confirm = false; render(); });
  const ms = $('[data-msg-send]'); if (ms) ms.addEventListener('click', async () => {
    const M = A.msg; M.busy = true; render();
    try {
      const res = await api('adminSendUpdate', { adminCode: A.code, audience: M.audience, email: M.email, news: M.news, notifyTeam: M.team,
        title: { de: M.titleDe.trim(), it: M.titleIt.trim() }, text: { de: M.textDe.trim(), it: M.textIt.trim() } });
      if (!res.ok) throw new Error(res.message || res.error);
      M.result = res; M.confirm = false;
      const fresh = await api('adminLogin', { adminCode: A.code }); if (fresh.ok) A.data = fresh;
      S.admin.wa.tpl = 'update'; S.admin.wa.de = ''; S.admin.wa.it = '';
    } catch(e){ M.confirm = false; setTimeout(() => { const er = $('#msgErr'); if (er) er.textContent = 'Senden hat nicht geklappt: ' + e.message; }, 0); }
    M.busy = false; render();
  });
  const gw = $('[data-goto-wa]'); if (gw) gw.addEventListener('click', () => { A.tab = 'wa'; A.wa.tpl = 'update'; A.wa.de = ''; A.wa.it = ''; render(); });
  $$('[data-tpl]').forEach(b => b.addEventListener('click', () => { A.wa.tpl = b.dataset.tpl; fillWaTemplate(); render(); }));
  $$('[data-waaud]').forEach(b => b.addEventListener('click', () => { A.wa.audience = b.dataset.waaud; render(); }));
  $$('[data-wa]').forEach(i => i.addEventListener('change', () => { A.wa[i.dataset.wa] = i.value; render(); }));

  $$('[data-wa-open]').forEach(a => a.addEventListener('click', e => {

/* ---------- Rendern & Ereignisse ---------- */
let cdTimer = null, sectionObserver = null;
function render(opts){
  const app = $('#app'), y = window.scrollY;
  document.documentElement.lang = S.lang;
  document.documentElement.classList.remove('modal-open');
  if (!document.getElementById('envStage')) document.documentElement.classList.remove('env-open');
  if (S.view === 'lang') app.innerHTML = viewLang();
  else if (S.view === 'gate') app.innerHTML = viewGate(opts && opts.err);
  else if (S.view === 'site') app.innerHTML = viewSite();
  else if (S.view === 'admin') app.innerHTML = viewAdmin();
  else if (S.view === 'error') app.innerHTML = '<main class="gate"><div class="wrap"><div class="invite">' + monogram('sm') + '<p>' + esc(t('loadError')) + '</p><button type="button" class="btn" id="retry">' + esc(t('retry')) + '</button></div></div></main>';
  else app.innerHTML = '<div class="loading">' + esc(t('loading')) + '</div>';
  bindCommon();
  if (S.view === 'site') { bindSite(); if (opts && opts.keepScroll) window.scrollTo(0, y); }
  if (S.view === 'admin') bindAdmin();
  updateEnvBadge();
}
function bindCommon(){
  $$('[data-lang]').forEach(b => b.addEventListener('click', () => { S.lang = b.dataset.lang; store.set('pl_lang', S.lang); store.set('pl_lang_set', '1'); S.langChosen = true; render({ keepScroll: true }); }));
  $$('[data-pick]').forEach(b => b.addEventListener('click', () => {
    S.lang = b.dataset.pick; store.set('pl_lang', S.lang); store.set('pl_lang_set', '1'); S.langChosen = true;
    window.scrollTo(0, 0); route();
    const g = $('#gateCode'); if (g && !g.value) g.focus();
  }));
  $$('[data-demo-toggle]').forEach(b => b.addEventListener('click', () => { S.demoOpen = !S.demoOpen; render({ keepScroll: true }); }));
  $$('[data-demo-reset]').forEach(b => b.addEventListener('click', demoResetAll));
  $$('[data-env-again]').forEach(b => b.addEventListener('click', () => {
    sess.del('pl_env'); S.demoOpen = false; render({ keepScroll: true }); mountEnvelope();
  }));
  $$('[data-demo-phase]').forEach(b => b.addEventListener('click', async () => {
    const st = demoLoad(); st.phase = b.dataset.demoPhase;
    if (st.phase === 'invite') { // wie live: beim Wechsel bekommen alle Kontakte die Einladung per Mail
      const today = new Date().toISOString().slice(0, 10);
      st.contacts.forEach(c => { if (!c.invited && !st.rsvps.some(r => r.email.toLowerCase() === c.email.toLowerCase())) c.invited = today; });
    }
    demoSave();
    S.preview = false; sess.del('pl_preview'); S.demoOpen = false;
    if (S.view === 'admin') { S.content = null; if (S.admin.code) await adminLoad(S.admin.code); else render(); return; }
    S.content = null; S.rsvp = freshRsvp(); S.rsvpDone = null; S.editing = false;
    if (S.code || S.token) await loadContent(); else render();
    window.scrollTo(0, 0);
  }));
  $$('[data-preview-end]').forEach(b => b.addEventListener('click', () => {
    S.preview = false; sess.del('pl_preview'); S.content = null; S.rsvp = freshRsvp(); S.rsvpDone = null;
    location.hash = '#admin';
  }));
  const gf = $('#gateForm'); if (gf) gf.addEventListener('submit', async e => {
    e.preventDefault(); const code = $('#gateCode').value.trim(); if (!code) { $('#gateErr').textContent = t('wrongCode'); return; }
    const btn = gf.querySelector('button'); btn.disabled = true;
    S.code = code; await loadContent(true);
  });
  const rt = $('#retry'); if (rt) rt.addEventListener('click', () => loadContent());
}
function bindSite(){
  $$('[data-target]').forEach(a => a.addEventListener('click', e => {
    const el = document.getElementById(a.dataset.target); if (!el) return;
    e.preventDefault(); el.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block:'start' });
  }));
  $$('[data-copy-addr]').forEach(b => b.addEventListener('click', () => { const el = $('#addr' + b.dataset.copyAddr); copyText(el.textContent, t('copied'), el); }));
  bindRsvp(); bindGifts(); bindContact(); bindRsvpWindow();
  const inp = $('#upFiles'), drop = $('#drop');
  if (inp) inp.addEventListener('change', () => uploadFiles(inp.files));
  if (drop) {
    ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => uploadFiles(e.dataTransfer && e.dataTransfer.files));
  }
  clearInterval(cdTimer);
  cdTimer = setInterval(() => {
    const st = S.content && S.content.settings, target = st && zurichTime(st.date, st.time); if (!target || S.view !== 'site') return;
    const diff = target - Date.now(); if (diff <= 0) { clearInterval(cdTimer); return; }
    const s = Math.floor(diff / 1000), parts = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
    $$('[data-cd]').forEach(b => { const i = +b.dataset.cd; b.textContent = i ? String(parts[i]).padStart(2, '0') : parts[i]; });
  }, 1000);
  if (sectionObserver) sectionObserver.disconnect();
  const links = $$('.nav-links a');
  if ('IntersectionObserver' in window && links.length) {
    sectionObserver = new IntersectionObserver(entries => entries.forEach(en => {
      if (en.isIntersecting) links.forEach(a => a.classList.toggle('active', a.dataset.target === en.target.id));
    }), { rootMargin:'-40% 0px -55% 0px' });
    $$('main section[id]').forEach(s => sectionObserver.observe(s));
  }
}

async function loadContent(fromGate){
  if (!fromGate) { S.view = 'loading'; render(); }
  try {
    const res = await api('content', { code: S.code, token: S.token, preview: S.preview, adminCode: S.preview ? S.admin.code : undefined });
    if (!res.ok) {
      if (S.token && res.error === 'code' && S.code) { S.token = ''; store.del('pl_rsvp'); return loadContent(fromGate); }
      S.view = 'gate'; render({ err: fromGate || !!S.code }); return;
    }
    if (S.code) store.set('pl_code', S.code);
    if (S.preview && !res.preview) { S.preview = false; sess.del('pl_preview'); }
    S.content = res.content;
    setTimeout(updateEnvelope, 0);
    if (res.myRsvp) { S.rsvp = fromServerRsvp(res.myRsvp); S.rsvpDone = { attending: !!res.myRsvp.attending, fresh: false }; store.set('pl_rsvp', res.myRsvp.id); }
    else if (S.token && !res.myRsvp) { S.token = ''; store.del('pl_rsvp'); }
    S.view = 'site'; render();
    if (params.get('r')) setTimeout(() => { const el = $('#anmeldung'); if (el) el.scrollIntoView({ block:'start' }); }, 60);
  } catch(e){ S.view = 'error'; render(); }
}

function route(){
  S.demoOpen = false;
  if (location.hash === '#admin') {
    if (S.view !== 'admin') window.scrollTo(0, 0);
    S.view = 'admin'; render();
    if (S.admin.code && !S.admin.busy) adminLoad(S.admin.code); // immer die neuesten Zahlen
    return;
  }
  if (!S.langChosen && !S.preview) { S.view = 'lang'; render(); return; }
  if (S.content) { S.view = 'site'; render(); return; }
  if (S.code || S.token || (S.preview && S.admin.code)) loadContent(); else { S.view = 'gate'; render(); }
}
window.addEventListener('hashchange', () => { if (location.hash === '#admin' || S.view === 'admin') route(); });
/* Paarfoto: liegt bilder/paar.jpg neben index.html, wird es automatisch verwendet */
S.paar = '';
(function findPaar(){
  const im = new Image();
  im.onload = () => {
    S.paar = 'bilder/paar.jpg';
    const h = document.querySelector('.hero .monogram');   // Startseite schon da: Foto nachträglich in den Kranz
    if (h && !h.classList.contains('photo')) h.outerHTML = monogram('lg', true);
  };
  im.src = 'bilder/paar.jpg';
})();
if (wantEnvelope()) mountEnvelope();
route();
})();
</script>
